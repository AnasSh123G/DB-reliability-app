# The tracked-station seed for `dbrel collect`.
#
# These 15 evas were resolved once against /station/ and behaviourally checked
# with tt-verify-stations (docs/probe-findings.md §22: 4 of the original 21
# needed a human, because IRIS and DELFI disagree on station names in ways a
# name search cannot resolve on its own). Re-running that name search after a
# `dbrel reset-db` would risk the same trap that caught them the first time —
# §14 records /station/KNE returning Neuwied, a valid rail eva for the wrong
# city — so instead this file is applied directly by name/natural_key match
# against the freshly-imported GTFS stations, at zero /station/ calls.
#
# natural_key is `normalize_name(name)@lat.3f,lon.3f` (gtfs/static_import.py),
# the same key gtfs.de station rows are deduplicated on, so it survives a feed
# rebuild even if the station's display name changes slightly. name is kept as
# a fallback for a first-time import where the natural_key hasn't been seen
# yet with this exact rounding.

name = "Ruhrgebiet corridor"
priority = 1

[[stations]]
name = "Bochum Hbf"
eva = 8000041
ds100 = "EBO"
natural_key = "bochum hbf@51.479,7.223"

