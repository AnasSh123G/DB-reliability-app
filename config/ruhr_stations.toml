# The tracked-station seed for `dbrel collect`.
#
# These EVAs were resolved once against /station/ (or, for the original 15, hand-verified
# earlier) and behaviourally checked with tt-verify-stations. Re-running the name search
# after a `dbrel reset-db` risks the same naming traps that make automatic resolution
# imperfect in the first place (docs/probe-findings.md §13/§14/§22/§25) -- so this file is
# applied directly by name/natural_key match against the freshly-imported GTFS stations, at
# zero /station/ calls.
#
# Corridor: every station within 70 km of Bochum Hbf that resolved to an IRIS eva, ranked by
# traffic. Expanded from the original 15-station Ruhrgebiet pilot on 2026-09-16; see §25 for
# why the automatic hit rate is well under 100% once minor stops are in scope.
#
# natural_key is `normalize_name(name)@lat.3f,lon.3f` (gtfs/static_import.py), the same key
# gtfs.de station rows are deduplicated on, so it survives a feed rebuild even if the
# station's display name changes slightly. name is kept as a fallback for a first-time
# import where the natural_key hasn't been seen yet with this exact rounding.

name = "Bochum corridor (70 km, traffic-ranked)"
priority = 1

