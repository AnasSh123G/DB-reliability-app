[project]
name = "dbrel"
version = "0.1.0"
description = "Local database of German train schedules and actual arrival/departure times"
readme = "README.md"
authors = [
    { name = "Anas", email = "anasah123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "gtfs-realtime-bindings>=2.2.0",
    "httpx>=0.28.1",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# The web UI is optional: the collector and the CLI must keep working on a machine
# that has no reason to serve pages.
web = [
    "django>=5.2,<6.0",
]

[project.scripts]
dbrel = "dbrel.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
