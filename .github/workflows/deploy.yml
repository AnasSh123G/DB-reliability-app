# Tests on every push and pull request; deploys to the home server only when the tests pass on main,
# through the self-hosted runner labelled "home" (deploy/compose.yaml).
# The database is not part of this: scripts/push_slim_db.sh uploads it to the server.
name: Test and deploy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q

  deploy-home:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, home]
    concurrency: deploy-home   # one deploy at a time
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 300
      - run: docker image prune -f
